plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.neoforged.moddev' version "${moddev_version}" apply false
	id 'net.neoforged.moddev.legacyforge' version "${moddev_version}" apply false
}

def loader = project.property("loader")
def minecraftVersion = project.minecraft_version
def neoforge = loader == "neoforge"
def forge = loader == "forge"
def fabric = !neoforge && !forge
def remap = fabric && minecraftVersion.startsWith("1.")

def versionProps = new Properties()
def propsFile = fabric ? file("versions/${minecraftVersion}.properties") : file("versions/${loader}/${minecraftVersion}.properties")
propsFile.withInputStream { versionProps.load(it) }

def gameVersion = versionProps.getProperty("minecraft", minecraftVersion)
def packs = versionProps.getProperty("packs").split(",")
def label = versionProps.getProperty("label")
def javaVersion = versionProps.getProperty("java").toInteger()
def gametest = fabric && versionProps.getProperty("gametest", "true") == "true"
def selfTest = forge || (fabric && minecraftVersion in ["1.18.2", "1.19.2", "1.20.1"])

def expansions = [java_version: javaVersion, loader_min: "0.19.3"]
versionProps.stringPropertyNames().each { expansions[it] = versionProps.getProperty(it) }

if (neoforge) {
	apply plugin: 'net.neoforged.moddev'
} else if (forge) {
	apply plugin: 'net.neoforged.moddev.legacyforge'
} else {
	apply plugin: remap ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
}

version = "${project.mod_version}+mc${label}"
expansions.version = project.version
group = project.maven_group

base {
	archivesName = fabric ? project.archives_base_name : "${project.archives_base_name}-${loader}"
}

sourceSets.main.java.srcDir "src/loader/${loader}/java"
sourceSets.main.resources.srcDir "src/loader/${loader}/resources"
packs.each { pack ->
	sourceSets.main.java.srcDir "src/compat/${pack}/java"
}
sourceSets.configureEach {
	if (gametest && it.name == "gametest") {
		packs.each { pack ->
			it.java.srcDir "src/compat/${pack}/gametest/java"
		}
	}
}

if (selfTest) {
	sourceSets {
		selftest {
			java.srcDir "src/selftest/${loader}/java"
			resources.srcDir "src/selftest/${loader}/resources"
			packs.each { pack ->
				java.srcDir "src/compat/${pack}/selftest/java"
			}
		}
	}
}

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

dependencies {
	if (neoforge || forge) {
		testImplementation "com.google.code.gson:gson:2.11.0"
		testImplementation "org.slf4j:slf4j-api:2.0.16"
	} else if (remap) {
		minecraft "com.mojang:minecraft:${gameVersion}"
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${versionProps.getProperty('fabric_api_version')}"
		modCompileOnly "com.terraformersmc:modmenu:${versionProps.getProperty('modmenu_version')}"
	} else {
		minecraft "com.mojang:minecraft:${gameVersion}"
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${versionProps.getProperty('fabric_api_version')}"
		compileOnly "com.terraformersmc:modmenu:${versionProps.getProperty('modmenu_version')}"
	}

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

if (neoforge) {
	sourceSets {
		nftest
	}

	dependencies {
		nftestImplementation sourceSets.main.output
	}

	neoForge {
		version = versionProps.getProperty("neoforge_version")
		addModdingDependenciesTo(sourceSets.nftest)
		runs {
			client {
				client()
			}
		}
		mods {
			identify {
				sourceSet sourceSets.main
			}
			identify_test {
				sourceSet sourceSets.nftest
			}
		}
	}
}

test {
	useJUnitPlatform()
}

if (forge) {
	dependencies {
		selftestImplementation sourceSets.main.output
	}

	legacyForge {
		if (versionProps.getProperty("neoforge_version") != null) {
			enable { neoForgeVersion = versionProps.getProperty("neoforge_version") }
		} else {
			version = versionProps.getProperty("forge_version")
		}
		addModdingDependenciesTo(sourceSets.selftest)
		mods {
			identify {
				sourceSet sourceSets.main
			}
			identify_selftest {
				sourceSet sourceSets.selftest
			}
		}
		runs {
			client {
				client()
				loadedMods = [mods.identify]
			}
			selftest {
				client()
				sourceSet = sourceSets.selftest
				loadedMods = [mods.identify, mods.identify_selftest]
			}
		}
	}
} else if (selfTest) {
	sourceSets.selftest.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
	sourceSets.selftest.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output

	loom {
		mods {
			identify {
				sourceSet sourceSets.main
			}
			identify_selftest {
				sourceSet sourceSets.selftest
			}
		}
		runs {
			selftest {
				client()
				source sourceSets.selftest
			}
		}
	}
}

processResources {
	inputs.properties(expansions)

	filesMatching(["fabric.mod.json", "identify.mixins.json", "META-INF/neoforge.mods.toml", "META-INF/mods.toml"] + (forge ? ["pack.mcmeta"] : [])) {
		expand expansions
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)

	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersion)
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

if (gametest) {
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "identify-test"
			enableGameTests = false
			enableClientGameTests = true
		}
	}
}
