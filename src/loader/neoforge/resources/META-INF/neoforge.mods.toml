modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/comedy01/Identify/issues"

[[mods]]
    modId = "identify"
    version = "${version}"
    displayName = "Identify"
    iconFile = "assets/identify/icon.png"
    description = '''Shows the name and icon of the block or entity you are looking at, with extras like crop growth and baby grow-up timers, and adds durability, food, and fuel info to item tooltips. Client-side only.'''
    authors = "comedy01"

[[dependencies.identify]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoforge_range}"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.identify]]
    modId = "minecraft"
    type = "required"
    versionRange = "${range}"
    ordering = "NONE"
    side = "CLIENT"
